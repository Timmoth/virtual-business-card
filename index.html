  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f7f6fb;
      background: #0b0d14;
      --mint: #b2ffe4;
      --rotate-x: 0deg;
      --rotate-y: 0deg;
      --drift-y: 0px;
      --sheen-x: 50%;
      --sheen-y: 50%;
      --foil-x: 50%;
      --foil-y: 50%;
    }
    @property --sheen-x { syntax: "<percentage>"; inherits: true; initial-value: 50%; }
    @property --sheen-y { syntax: "<percentage>"; inherits: true; initial-value: 50%; }
    * { box-sizing: border-box; }
    html { overflow-x: hidden; } /* .card-wrap::before's negative inset (the blurred halo) bleeds past body's own overflow:hidden on narrow phones */
    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      background-color: #080b12;
      background-image:
        radial-gradient(ellipse 700px 430px at 50% 47%, rgb(78 71 127 / .24), transparent 72%),
        radial-gradient(ellipse 460px 360px at 13% 84%, rgb(29 117 109 / .09), transparent 74%),
        radial-gradient(ellipse 500px 330px at 88% 13%, rgb(121 73 135 / .09), transparent 75%),
        linear-gradient(145deg, #12141e 0%, #0b0d14 58%, #080b12 100%);
      background-attachment: fixed;
    }
    .card-wrap {
      position: relative;
      isolation: isolate;
      width: min(100%, 760px);
      perspective: 1100px;
    }
    .card-wrap::before {
      position: absolute;
      z-index: -1;
      inset: -18%;
      content: "";
      border-radius: 50%;
      background: radial-gradient(ellipse at 48% 52%, rgb(132 106 228 / .27), rgb(72 174 168 / .12) 42%, transparent 72%);
      filter: blur(38px);
      opacity: .72;
      pointer-events: none;
      animation: bloom 11s ease-in-out infinite alternate;
    }
    @keyframes bloom {
      from { opacity: .52; transform: scale(.96); }
      to { opacity: .82; transform: scale(1.04); }
    }
    .card {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(16px, 4vw, 48px);
      width: 100%;
      aspect-ratio: 1.65;
      padding: clamp(18px, 5vw, 58px);
      overflow: hidden;
      border: 1px solid rgb(210 255 242 / .35);
      border-radius: clamp(16px, 2.5vw, 25px);
      background: linear-gradient(130deg, #222338, #11151f 56%, #171922);
      box-shadow:
        0 0 0 1px rgb(178 255 228 / .08),
        0 0 18px 1px rgb(116 255 221 / .16),
        0 0 42px 2px rgb(168 130 255 / .13),
        0 30px 100px rgb(0 0 0 / .5),
        inset 0 1px 0 rgb(255 255 255 / .22);
      transform: perspective(1100px) translateY(var(--drift-y)) rotateX(var(--rotate-x)) rotateY(var(--rotate-y));
      transform-style: preserve-3d;
      transition: transform 180ms ease-out, --sheen-x 240ms ease-out, --sheen-y 240ms ease-out;
      will-change: transform;
      touch-action: none;
    }
    /* The same slow-moving glitter used on timmoth.com, clipped to the card. */
    .sparkles {
      position: absolute;
      z-index: 1;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      mix-blend-mode: screen;
      opacity: .12;
      pointer-events: none;
    }
    .sparkles.is-ready { background: url("/sparkles.gif") repeat; background-size: 768px auto; }
    /* Broad foil color shifts with card tilt; the specular spot follows its angle. */
    .card::before, .card::after {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }
    .card::before {
      z-index: 2;
      background-image:
        radial-gradient(ellipse at 19% 17%, rgb(119 255 224 / .22), transparent 38%),
        radial-gradient(ellipse at 78% 25%, rgb(195 151 255 / .22), transparent 41%),
        radial-gradient(ellipse at 56% 94%, rgb(255 157 212 / .18), transparent 43%),
        linear-gradient(118deg, transparent 4%, rgb(125 240 255 / .13) 24%, rgb(183 157 255 / .25) 44%, rgb(255 168 221 / .20) 62%, rgb(255 230 165 / .13) 82%, transparent 98%);
      background-size: auto, auto, auto, 260% 260%;
      background-position: center, center, center, var(--foil-x) var(--foil-y);
      mix-blend-mode: screen;
      opacity: .95;
    }
    .card::after {
      z-index: 3;
      background-image:
        radial-gradient(ellipse at var(--sheen-x) var(--sheen-y), rgb(255 255 255 / .25), rgb(144 255 236 / .07) 25%, transparent 54%),
        linear-gradient(118deg, transparent 21%, rgb(255 255 255 / .055) 48%, transparent 56%);
      mix-blend-mode: screen;
      opacity: .65;
    }
    .portrait {
      position: relative;
      z-index: 4;
      --portrait-size: clamp(68px, 24vw, 210px);
      width: var(--portrait-size);
      height: var(--portrait-size);
      aspect-ratio: 1;
      justify-self: end;
      flex: none;
      overflow: hidden;
      padding: 5px;
      border: 1px solid rgb(255 255 255 / .67);
      border-radius: 50%;
      background: conic-gradient(from 205deg, #8dffe0, #d5b9ff, white, #9affeb, #c29fff, #8dffe0);
      box-shadow: 0 0 0 5px rgb(255 255 255 / .035), 0 0 34px rgb(139 255 222 / .22), 0 0 62px rgb(193 151 255 / .14);
      transform: translateZ(16px);
      opacity: 0;
      transition: opacity 350ms ease;
    }
    .portrait.is-ready { opacity: 1; }
    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      border: 1px solid rgb(255 255 255 / .3);
      border-radius: 50%;
      object-fit: cover;
      transform: scale(1.12);
    }
    .portrait picture { display: block; width: 100%; height: 100%; }
    .identity { position: relative; z-index: 4; min-width: 0; transform: translateZ(20px); }
    .name-line { position: relative; width: max-content; max-width: 100%; padding-top: 13px; }
    .role {
      position: absolute;
      top: 0;
      right: 0;
      margin: 0;

      font-size: clamp(10px, 1.5vw, 11px);
      font-weight: 750;
      letter-spacing: .2em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 62px);
      font-weight: 680;
      line-height: .98;
      letter-spacing: -.065em;
      text-wrap: balance;
    }
    .tagline {
      max-width: 32ch;
      margin: 12px 0 0;
      color: #d0d1dc;
      font-size: clamp(11px, 2vw, 16px);
      line-height: 1.45;
    }
    .tagline strong { color: #fff; font-weight: 650; }
    .copy-contact { padding: 0; background: transparent; cursor: pointer; }
    .copy-contact .copied-icon { display: none; }
    .copy-contact.is-copied { color: var(--mint); border-color: rgb(178 255 228 / .6); background: rgb(178 255 228 / .08); }
    .copy-contact.is-copied .contact-icon { display: none; }
    .copy-contact.is-copied .copied-icon { display: block; }
    .copy-toast { position: absolute; z-index: 5; bottom: clamp(8px, 2vw, 16px); left: 50%; width: max-content; max-width: calc(100% - 24px); padding: 8px 14px; border: 1px solid rgb(255 255 255 / .12); border-radius: 999px; color: #f7f6fb; background: rgb(24 27 38 / .94); box-shadow: 0 8px 24px rgb(0 0 0 / .28); font-size: 12px; font-weight: 600; opacity: 0; visibility: hidden; transform: translate(-50%, 8px); transition: opacity .18s ease, transform .18s ease, visibility .18s ease; pointer-events: none; }
    .copy-toast.is-visible { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 7px 13px; margin-top: clamp(12px, 2.8vw, 25px); }
    .contact, .resume {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }
    .contact { padding: 0 14px; color: #09120f; background: var(--mint); }
    .contact:hover { transform: translateY(-2px); background: #d0ffed; }
    .contact svg { width: 15px; height: 15px; }
    .resume { color: #e2e1eb; }
    .resume:hover { transform: translateY(-2px); color: white; text-decoration: underline; text-underline-offset: 4px; }
    .socials { display: flex; align-items: center; gap: 6px; margin-top: clamp(10px, 2vw, 18px); }
    .social-link, .copy-contact {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgb(255 255 255 / .17);
      border-radius: 50%;
      color: #d8d8e3;
      transition: transform .18s ease, color .18s ease, border-color .18s ease, background .18s ease;
    }
    .social-link:hover, .copy-contact:hover { transform: translateY(-2px); color: var(--mint); border-color: rgb(178 255 228 / .6); background: rgb(178 255 228 / .08); }
    .social-link svg, .copy-contact svg { width: 15px; height: 15px; }
    :focus-visible { outline: 3px solid #ffdd62; outline-offset: 4px; }
    @media (min-width: 1100px) {
      .card { grid-template-columns: 1fr auto; }
      .portrait { grid-column: 2; grid-row: 1; }
      .identity { grid-column: 1; grid-row: 1; }
    }
    @media (max-width: 560px) {
      body { padding: 16px; }
      .card { gap: 11px; padding: 16px; border-radius: 17px; }
      .portrait { --portrait-size: clamp(62px, 21vw, 88px); padding: 3px; }
      h1 { font-size: clamp(25px, 8vw, 34px); }
      .tagline { margin-top: 7px; font-size: 12px; }
      .actions { gap: 5px 10px; margin-top: 9px; }
      .contact, .resume { min-height: 30px; font-size: 12px; }
      .contact { padding-inline: 10px; }
      .contact svg { width: 12px; height: 12px; }
      .socials { gap: 4px; margin-top: 7px; }
      .social-link, .copy-contact { width: 25px; height: 25px; }
      .social-link svg, .copy-contact svg { width: 12px; height: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
      .card { transform: none !important; will-change: auto; }
      .card-wrap::before { animation: none; }
    }
  </style>

  <script>
    (() => {
      const card = document.getElementById('card');
      const wrap = document.getElementById('cardWrap');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const touchInput = window.matchMedia('(pointer: coarse)').matches;
      const portrait = document.querySelector('.portrait');
      const portraitImage = portrait.querySelector('img');
      const sparkles = document.querySelector('.sparkles');
      let manual = false;

      const contactValues = {
        email: 'aGVsbG9AdGltbW90aC5jb20=',
        phone: 'KzQ0IDA3OTIzNjA4NjQz'
      };
      const copyStatus = document.getElementById('contactCopyStatus');
      let toastTimer;
      document.querySelectorAll('.copy-contact').forEach((button) => {
        let resetTimer;
        button.addEventListener('click', async () => {
          const kind = button.dataset.contact;
          try {
            await navigator.clipboard.writeText(atob(contactValues[kind]));
            const label = kind === 'email' ? 'Email address' : 'Phone number';
            button.classList.add('is-copied');
            button.setAttribute('aria-label', `${label} copied to clipboard`);
            button.setAttribute('title', `${label} copied to clipboard`);
            copyStatus.textContent = 'Copied';
            copyStatus.classList.add('is-visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => copyStatus.classList.remove('is-visible'), 1800);
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => {
              button.classList.remove('is-copied');
              button.setAttribute('aria-label', `Copy ${label.toLowerCase()}`);
              button.setAttribute('title', `Copy ${label.toLowerCase()}`);
            }, 1800);
          } catch {
            copyStatus.textContent = 'Could not copy';
            copyStatus.classList.add('is-visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => copyStatus.classList.remove('is-visible'), 1800);
          }
        });
      });

      const revealPortrait = () => {
        if (portraitImage.naturalWidth > 0) {
          portrait.classList.add('is-ready');
          sparkles.classList.add('is-ready');
        }
      };
      if (portraitImage.complete) revealPortrait();
      else portraitImage.addEventListener('load', revealPortrait, { once: true });

      const setPose = (x, y, lift = 0) => {
        card.style.setProperty('--rotate-x', `${x.toFixed(2)}deg`);
        card.style.setProperty('--rotate-y', `${y.toFixed(2)}deg`);
        card.style.setProperty('--drift-y', `${lift.toFixed(2)}px`);
        card.style.setProperty('--sheen-x', `${(50 - y * 2.2).toFixed(1)}%`);
        card.style.setProperty('--sheen-y', `${(50 + x * 2.4).toFixed(1)}%`);
        card.style.setProperty('--foil-x', `${(50 - y * 3.2).toFixed(1)}%`);
        card.style.setProperty('--foil-y', `${(50 + x * 3.8).toFixed(1)}%`);
      };

      const pointAt = (clientX, clientY) => {
        const bounds = wrap.getBoundingClientRect();
        const px = Math.max(-1, Math.min(1, ((clientX - bounds.left) / bounds.width - .5) * 2));
        const py = Math.max(-1, Math.min(1, ((clientY - bounds.top) / bounds.height - .5) * 2));
        setPose(-py * (touchInput ? 10 : 8), px * (touchInput ? 14 : 10), -1.5);
      };

      wrap.addEventListener('pointermove', (event) => {
        if (event.pointerType !== 'touch' && !reduceMotion.matches) {
          manual = true;
          pointAt(event.clientX, event.clientY);
        }
      });
      wrap.addEventListener('pointerleave', () => { manual = false; });
      wrap.addEventListener('touchmove', (event) => {
        if (event.touches.length && !reduceMotion.matches) {
          manual = true;
          pointAt(event.touches[0].clientX, event.touches[0].clientY);
        }
      }, { passive: true });
      wrap.addEventListener('touchend', () => { manual = false; }, { passive: true });

      if (!reduceMotion.matches) {
        const start = performance.now();
        const drift = (now) => {
          if (!manual) {
            const t = (now - start) / 1000;
            const strength = touchInput ? 1.7 : 1;
            const x = (Math.sin(t * .31) * 3.8 + Math.sin(t * .15) * .9) * strength;
            const y = (Math.cos(t * .25) * 4.7 + Math.sin(t * .11) * .8) * strength;
            setPose(x, y, Math.sin(t * .4) * 3.5);
          }
          requestAnimationFrame(drift);
        };
        requestAnimationFrame(drift);
      }
    })();
  </script>
</body>
</html>
